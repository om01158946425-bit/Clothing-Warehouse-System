{% extends "base.html" %}
{% block title %}{{ 'Add supplier' if is_new else 'Edit supplier' }}{% endblock %}
{% block content %}
<h1>{{ 'Add supplier' if is_new else 'Edit supplier' }}</h1>
<form class="form" method="post">
  <label class="full">Name<input name="name" value="{{ s.get('name', '') }}" required></label>
  <label>Phone<input name="phone" value="{{ s.get('phone', '') }}"></label>
  <label>Address<input name="address" value="{{ s.get('address', '') }}"></label>
  <div class="actions full">
    <button type="submit">{{ 'Add supplier' if is_new else 'Save changes' }}</button>
    <a class="btn ghost" href="{{ url_for('suppliers') }}">Cancel</a>
  </div>
</form>
{% endblock %}

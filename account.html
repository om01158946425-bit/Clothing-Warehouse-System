{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
<form class="form" method="post">
  <label class="full">Current password<input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password<input name="new" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>Repeat new password<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
  <p class="hint full">At least 8 characters.</p>
  <div class="actions full">
    <button type="submit">Change password</button>
    <a class="btn ghost" href="{{ url_for('dashboard') }}">Cancel</a>
  </div>
</form>
{% endblock %}
